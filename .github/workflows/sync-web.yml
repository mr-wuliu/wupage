name: Sync website with release

# Triggered manually OR by release.yml after a successful release.
# Updates legacy hardcoded version references in wupage-web/index.html,
# and syncs the validated stable Chromium update feed before committing.
#
# Requires repository secret WUPAGE_WEB_PAT in mr-wuliu/wupage:
#   Fine-grained PAT, resource owner = mr-wuliu,
#   repository access = mr-wuliu/wupage-web only,
#   Contents permission = Read and write.
#
# Why workflow_dispatch and not `on: release: published`?
#   release.yml creates releases with the default GITHUB_TOKEN, which makes
#   the release:published event actor = github-actions[bot]. GitHub's
#   loop-prevention policy drops events from bot accounts, so the release
#   trigger never fires. release.yml instead explicitly dispatches this
#   workflow via `gh workflow run` after a successful release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v0.1.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sync-wupage-website
  cancel-in-progress: false

jobs:
  sync-website:
    name: Push version to wupage-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wupage (for sync script)
        uses: actions/checkout@v6

      - name: Checkout wupage-web (target)
        uses: actions/checkout@v6
        with:
          repository: mr-wuliu/wupage-web
          token: ${{ secrets.WUPAGE_WEB_PAT }}
          path: wupage-web

      - name: Fetch release info
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: python3 -B scripts/prepare-web-sync.py "$TAG"

      - name: Download published stable update manifest
        if: steps.release.outputs.sync == 'true' && steps.release.outputs.crx_name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release download "$RELEASE_TAG" --pattern chromium.xml --dir .npm-cache/release-updates

      - name: Run sync script
        if: steps.release.outputs.sync == 'true'
        env:
          NEW_TAG: ${{ steps.release.outputs.tag }}
          NEW_ZIP_NAME: ${{ steps.release.outputs.zip_name }}
          NEW_ZIP_URL: ${{ steps.release.outputs.zip_url }}
          NEW_ZIP_SIZE: ${{ steps.release.outputs.zip_size }}
          TARGET_DIR: wupage-web
          NEW_CRX_NAME: ${{ steps.release.outputs.crx_name }}
          NEW_CRX_SHA256: ${{ steps.release.outputs.crx_sha256 }}
          NEW_CRX_SIZE: ${{ steps.release.outputs.crx_size }}
          NEW_UPDATE_XML: ${{ steps.release.outputs.crx_name != '' && '.npm-cache/release-updates/chromium.xml' || '' }}
        run: python3 scripts/sync-web.py

      - name: Commit and push
        if: steps.release.outputs.sync == 'true'
        working-directory: wupage-web
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if [ -f updates/chromium.xml ]; then git add updates/chromium.xml; fi
          if git diff --cached --quiet; then
            echo "No changes — website and update feed already in sync."
            exit 0
          fi
          git commit -m "Auto-sync with wupage $RELEASE_TAG

          Triggered by workflow_dispatch after release $RELEASE_TAG
          on mr-wuliu/wupage. Updated release download references and stable update feed."
          git push
