name: Check pull request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Types, tests and browser builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm test

      - name: Build Chrome and Edge extension
        run: npm run build

      - name: Build Firefox extension
        run: npm run build:firefox

      - name: Install inbox layout regression tools
        run: |
          npm install --prefix .npm-cache/mail-test-tools --no-save --package-lock=false playwright@1.64.1
          node .npm-cache/mail-test-tools/node_modules/playwright/cli.js install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Check inbox translation layout
        run: npm run test:mail-layout
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.npm-cache/mail-test-tools/node_modules/playwright/index.mjs

      - name: Check embedded document connection recovery
        run: npm run test:frame-connection
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.npm-cache/mail-test-tools/node_modules/playwright/index.mjs

      - name: Check PDF layout and export safeguards
        run: npm run test:pdf:quality -- --profile=smoke
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.npm-cache/mail-test-tools/node_modules/playwright/index.mjs

      - name: Upload page translation failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: page-translation-failure
          path: |
            .npm-cache/mail-layout/chrome/*.png
            .npm-cache/mail-layout/chrome/*.json
            .npm-cache/mail-layout/chrome/*.txt
            .npm-cache/frame-connection/chrome/*.png
            .npm-cache/frame-connection/chrome/*.json
            .npm-cache/frame-connection/chrome/*.txt
            .npm-cache/pdf-quality/smoke/**/report.json
            .npm-cache/pdf-quality/smoke/**/report.html
            .npm-cache/pdf-quality/smoke/**/*quality.json
            .npm-cache/pdf-quality/smoke/**/*.png
            .npm-cache/pdf-quality/smoke/**/run.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Check content scripts and package test builds
        shell: bash
        run: |
          node --input-type=commonjs --check < dist/content.js
          node --input-type=commonjs --check < dist-firefox/content.js
          python3 - <<'PY'
          import hashlib
          import pathlib
          import zipfile

          output = pathlib.Path('artifacts')
          output.mkdir(exist_ok=True)
          for source, browser in [('dist', 'chrome-edge'), ('dist-firefox', 'firefox')]:
              source = pathlib.Path(source)
              assert (source / 'manifest.json').is_file()
              archive = output / f'wupage-pr-{browser}.zip'
              with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as package:
                  for path in sorted(source.rglob('*')):
                      if path.is_file():
                          package.write(path, path.relative_to(source))
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              archive.with_suffix('.zip.sha256').write_text(f'{digest}  {archive.name}\n')
          PY

      - name: Upload test packages
        uses: actions/upload-artifact@v4
        with:
          name: wupage-pr-${{ github.event.pull_request.number || github.run_number }}-browsers
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
